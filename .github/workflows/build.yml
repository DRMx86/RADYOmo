name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ folder (not stored in the repo)
      - name: Generate platform folders
        run: flutter create --platforms=android --org com.phradio --project-name ph_radio .

      - name: Patch AndroidManifest for background audio
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ph-radio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
